# Freeplay game definition: OpenRCT2.
#
# Descriptive, not executable — nothing loads this file at runtime. It is the one
# place that records how this game is reached and driven, for humans and the docs.
# Values here are copies: change the real source (noted per field) as well.

id: openrct2
name: OpenRCT2
homepage: https://openrct2.org

bridge:
  # The plugin opens this listener from inside the game process. Loopback only.
  host: 127.0.0.1
  port: 8080
  mcp_endpoint: http://127.0.0.1:8080/mcp
  transport: streamable-http
  # Useful by hand while debugging.
  openapi: http://127.0.0.1:8080/openapi.yaml
  swagger: http://127.0.0.1:8080/swagger
  dashboard: http://127.0.0.1:8080/dashboard
  plugin:
    source: servers/openrct2
    bundle: servers/openrct2/out/mcp.js
    # macOS. On Linux this is ~/.config/OpenRCT2/plugin.
    install_path: ~/Library/Application Support/OpenRCT2/plugin/freeplay-bridge.js

launch:
  # OpenRCT2 must already be running with a scenario loaded before the harness starts;
  # the bridge lives inside the game process, so there is nothing to start separately.
  # Edit macos_app below if yours is elsewhere; nothing reads an environment variable.
  macos_app: /Applications/OpenRCT2.app
  command: open -a /Applications/OpenRCT2.app
  requires:
    # OpenRCT2 needs the original RCT2 data files, from Steam or GOG.
    - RCT2 game assets
  notes: >
    Load a scenario from the title screen before starting a run. The plugin registers at
    game start; if the listener is not answering, check the in-game console for
    "Server listening on 127.0.0.1:8080".

speed:
  # Rendering stays on: inference dominates wall-clock, so frame time is not the
  # bottleneck. Game speed is the throughput lever, and the model holds it: both actions
  # below are wrapped by the set_game_speed tool.
  action: gamesetspeed
  # The game's own range, from GameSetSpeedAction::IsValidSpeed. These are speed SETTINGS,
  # not multipliers: the loop runs 1 << (speed - 1) updates, so 1 is normal, 2 is twice,
  # 3 is four times and 4 is eight times. 5 to 8 exist only with the game's debugging
  # tools on, which a plugin can neither read nor enable.
  values: [1, 2, 3, 4]
  default: 1
  # speed 4, i.e. eight times normal.
  example: 'context.executeAction("gamesetspeed", { speed: 4 }, function (r) {})'
  pause:
    # Toggles rather than sets, so read context.paused before firing it.
    action: pausetoggle
    example: 'context.executeAction("pausetoggle", {}, function (r) {})'

agent:
  # The one system prompt. scripts/run.sh copies it to pi/SYSTEM.md on every run, and
  # that copy is gitignored: edit this file, never the copy.
  system_prompt: games/openrct2/prompt.md
  # Sixteen, matching src/tools/index.ts. Every one is re-read by the model each turn.
  tools:
    # Perception: what a player reads off the screen.
    - park_status
    - guest_feedback
    - list_ride_objects
    - find_build_sites
    - view_map
    # Action: the mechanics of carrying out a decision. These are the deferred ones —
    # they act, then answer once the work has landed a few ticks later.
    - clear_scenery
    - build_flat_ride
    - build_path
    - remove_path
    - operate_ride
    - open_park
    - hire_staff
    - buy_land
    # The clock. A human player controls game speed and spends time watching, so the
    # model does both. wait is deferred like the action tools above.
    - set_game_speed
    - wait
    # Everything else.
    - evaluate
